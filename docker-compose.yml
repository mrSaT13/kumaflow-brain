# KumaFlow Brain — тестовый сервер. Всё в одном файле, отдельного .env не нужно.
#
# Твой Navidrome крутится ОТДЕЛЬНО — поэтому его здесь нет, backend ходит
# к нему по HTTP. Папку с музыкой монтировать НЕ надо: аудиофайлы бэкенд
# с диска не читает, всё (метаданные, обложки, сканирование) идёт через
# Subsonic API твоего Navidrome.
#
# Деплой на сервере:
#   1. git clone https://github.com/mrSaT13/kumaflow-brain.git kumaflow && cd kumaflow
#   2. Отредактируй СЕКРЕТЫ ниже (пароли + адрес Navidrome)
#   3. docker compose pull && docker compose up -d
#
# Обновление после нового пуша в main:
#   git pull && docker compose pull && docker compose up -d
# ВНИМАНИЕ: репозиторий публичный. Реальные пароли — только в копии на
# сервере, никогда не делай git push с сервера.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kumaflow
      POSTGRES_PASSWORD: CHANGE_ME_postgres_password
      POSTGRES_DB: kumaflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumaflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/mrsat13/kumaflow-brain-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: prod
      LOG_LEVEL: INFO
      # «Домашнее» время: границы суток daily-плейлистов, срабатывание крона,
      # контекст утро/вечер в волне, подписи времени в API.
      # IANA-имя или сдвиг (+4). UTC+4 = Europe/Samara (Самара/Саратов/Ижевск),
      # Asia/Dubai, Asia/Yerevan — подставь свой город.
      APP_TIMEZONE: UTC
      DB_URL_OVERRIDE: ""
      POSTGRES_HOST: postgres
      POSTGRES_USER: kumaflow
      POSTGRES_PASSWORD: CHANGE_ME_postgres_password
      POSTGRES_DB: kumaflow
      REDIS_HOST: redis
      # ВАЖНО: backend/worker'ы НЕ стартуют с плейсхолдерами токенов/ключей
      # CHANGE_ME_* (fail-fast) — кроме POSTGRES_PASSWORD (там только warning:
      # pgdata помнит пароль первой инициализации, смена только в env даст
      # рассинхрон). Сгенерировать токен: openssl rand -hex 32. Тот же токен —
      # в плеер/мобилу.
      BRAIN_API_TOKEN: CHANGE_ME_brain_token
      # Сейф паролей (opt-in автообновление вкусов, Fernet). Сгенерировать один раз:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Пусто = автообновление выключено (ручной импорт работает всегда).
      TASTE_VAULT_KEY: CHANGE_ME_taste_vault_key
      # Твой внешний Navidrome. host.docker.internal = сам хост-сервер
      # (работает на Linux Docker 20.10+). Если Navidrome на другой машине —
      # впиши её IP: http://192.168.x.x:4533
      MEDIA_SERVER_TYPE: navidrome
      NAVIDROME_URL: http://host.docker.internal:4533
      # Логин/пароль можно вписать сюда ИЛИ позже в веб-UI (Настройки → Медиа-сервер)
      # NAVIDROME_USER: admin
      # NAVIDROME_PASSWORD: CHANGE_ME_navidrome_password
      # CORS для прямых обращений к backend из браузера. Через веб-прокси
      # (http://<ip-сервера>:3000/api) CORS не нужен — там same-origin.
      # Адреса из локальной сети (192.168.x.x, 10.x.x.x, 172.16-31.x.x)
      # backend разрешает сам; ниже — только для внешних имён/доменов.
      CORS_ORIGINS: '["http://localhost:3000","http://CHANGE_ME_server_ip:3000"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # CLAP-модель (~350МБ) — отдельно от образа: скачивается один раз
      # на сервере и переживает пересборки. Пусто = backend работает
      # без CLAP («Открытия недели» = cold-start, видно в Автоматизации).
      # Без :ro — чтобы качать прямо в volume: docker compose exec backend python -m ml.download_clap
      - ./deploy/models:/app/ml/models

  # Лёгкие задачи: high/default/light (taste, notify, scan, playlists).
  worker:
    image: ghcr.io/mrsat13/kumaflow-brain-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ENV: prod
      LOG_LEVEL: INFO
      DB_URL_OVERRIDE: ""
      POSTGRES_HOST: postgres
      POSTGRES_USER: kumaflow
      POSTGRES_PASSWORD: CHANGE_ME_postgres_password
      POSTGRES_DB: kumaflow
      REDIS_HOST: redis
      BRAIN_API_TOKEN: CHANGE_ME_brain_token
      # Сейф паролей для автообновления вкусов (тот же ключ, что у backend).
      TASTE_VAULT_KEY: CHANGE_ME_taste_vault_key
      MEDIA_SERVER_TYPE: navidrome
      NAVIDROME_URL: http://host.docker.internal:4533
      QUEUES: high,default,light
      ANALYSIS_SAMPLE_SECONDS: 90
      ANALYSIS_MAX_TRACKS_PER_RUN: 0  # 0 = весь остаток за раз
    volumes:
      - ./deploy/models:/app/ml/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.workers.rq_worker"]

  # Тяжёлый аудио-анализ (librosa) — ОТДЕЛЬНО, чтобы не блокировать очередь.
  worker-audio:
    image: ghcr.io/mrsat13/kumaflow-brain-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ENV: prod
      LOG_LEVEL: INFO
      DB_URL_OVERRIDE: ""
      POSTGRES_HOST: postgres
      POSTGRES_USER: kumaflow
      POSTGRES_PASSWORD: CHANGE_ME_postgres_password
      POSTGRES_DB: kumaflow
      REDIS_HOST: redis
      BRAIN_API_TOKEN: CHANGE_ME_brain_token
      TASTE_VAULT_KEY: CHANGE_ME_taste_vault_key
      MEDIA_SERVER_TYPE: navidrome
      NAVIDROME_URL: http://host.docker.internal:4533
      QUEUES: audio
      ANALYSIS_SAMPLE_SECONDS: 90
      ANALYSIS_MAX_TRACKS_PER_RUN: 200  # чанками с resume, не всё за раз
    volumes:
      - ./deploy/models:/app/ml/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.workers.rq_worker", "audio"]

  # CLAP-эмбеддинги — отдельно (модель ~350МБ, долгая загрузка).
  worker-clap:
    image: ghcr.io/mrsat13/kumaflow-brain-backend:latest
    restart: unless-stopped
    profiles: [ml]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ENV: prod
      LOG_LEVEL: INFO
      DB_URL_OVERRIDE: ""
      POSTGRES_HOST: postgres
      POSTGRES_USER: kumaflow
      POSTGRES_PASSWORD: CHANGE_ME_postgres_password
      POSTGRES_DB: kumaflow
      REDIS_HOST: redis
      BRAIN_API_TOKEN: CHANGE_ME_brain_token
      TASTE_VAULT_KEY: CHANGE_ME_taste_vault_key
      MEDIA_SERVER_TYPE: navidrome
      NAVIDROME_URL: http://host.docker.internal:4533
      QUEUES: clap
    volumes:
      - ./deploy/models:/app/ml/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.workers.rq_worker", "clap"]

  # Планировщик крона — ОДИН инстанс (не внутри воркера, иначе дубли).
  scheduler:
    image: ghcr.io/mrsat13/kumaflow-brain-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ENV: prod
      LOG_LEVEL: INFO
      DB_URL_OVERRIDE: ""
      POSTGRES_HOST: postgres
      POSTGRES_USER: kumaflow
      POSTGRES_PASSWORD: CHANGE_ME_postgres_password
      POSTGRES_DB: kumaflow
      REDIS_HOST: redis
      BRAIN_API_TOKEN: CHANGE_ME_brain_token
      TASTE_VAULT_KEY: CHANGE_ME_taste_vault_key
    command: ["python", "-m", "app.workers.scheduler"]

  # Ночной бэкап pgdata (pg_dump в ./backups, ротация 14 дней).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: CHANGE_ME_postgres_password
    volumes:
      - ./backups:/backups
    entrypoint: |
      sh -c 'echo "0 3 * * * pg_dump -h postgres -U kumaflow kumaflow | gzip > /backups/kumaflow-$$(date +\%Y\%m\%d-\%H\%M).sql.gz && ls -t /backups/kumaflow-*.sql.gz | tail -n +15 | xargs -r rm --" | crontab - && crond -f'

  web:
    image: ghcr.io/mrsat13/kumaflow-brain-web:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      KUMAFLOW_API_URL: http://backend:8000
    ports:
      - "3000:3000"

  # Опционально: мост метаданных (MusicBrainz / Last.fm). Включается профилем:
  #   docker compose --profile bridge up -d
  # Адрес моста затем указывается в веб-UI: Настройки → Мост → http://bridge:8001
  bridge:
    image: ghcr.io/mrsat13/kumaflow-brain-bridge:latest
    restart: unless-stopped
    profiles: [bridge]
    environment:
      # Ключ: https://www.last.fm/api/account/create (без него — только MusicBrainz)
      LASTFM_API_KEY: ""
      BRIDGE_USER_AGENT: KumaFlowBridge/0.1
      BRIDGE_CACHE_TTL_HOURS: 24
    ports:
      - "8001:8001"

volumes:
  pgdata:
  redisdata:
