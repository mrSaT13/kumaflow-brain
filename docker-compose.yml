# KumaFlow Brain — тестовый сервер. Всё в одном файле, отдельного .env не нужно.
#
# Твой Navidrome крутится ОТДЕЛЬНО — поэтому его здесь нет, backend ходит
# к нему по HTTP. Папку с музыкой монтировать НЕ надо: аудиофайлы бэкенд
# с диска не читает, всё (метаданные, обложки, сканирование) идёт через
# Subsonic API твоего Navidrome.
#
# Деплой на сервере:
#   1. git clone https://github.com/mrSaT13/kumaflow-brain.git kumaflow && cd kumaflow
#   2. Отредактируй СЕКРЕТЫ ниже (пароли + адрес Navidrome)
#   3. docker compose pull && docker compose up -d
#
# Обновление после нового пуша в main:
#   git pull && docker compose pull && docker compose up -d
# ВНИМАНИЕ: репозиторий публичный. Реальные пароли — только в копии на
# сервере, никогда не делай git push с сервера.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kumaflow
      POSTGRES_PASSWORD: CHANGE_ME_postgres_password
      POSTGRES_DB: kumaflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumaflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/mrsat13/kumaflow-brain-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: prod
      LOG_LEVEL: INFO
      DB_URL_OVERRIDE: ""
      POSTGRES_HOST: postgres
      POSTGRES_USER: kumaflow
      POSTGRES_PASSWORD: CHANGE_ME_postgres_password
      POSTGRES_DB: kumaflow
      REDIS_HOST: redis
      # Твой внешний Navidrome. host.docker.internal = сам хост-сервер
      # (работает на Linux Docker 20.10+). Если Navidrome на другой машине —
      # впиши её IP: http://192.168.x.x:4533
      MEDIA_SERVER_TYPE: navidrome
      NAVIDROME_URL: http://host.docker.internal:4533
      # Логин/пароль можно вписать сюда ИЛИ позже в веб-UI (Настройки → Медиа-сервер)
      # NAVIDROME_USER: admin
      # NAVIDROME_PASSWORD: CHANGE_ME_navidrome_password
      CORS_ORIGINS: '["http://localhost:3000","http://CHANGE_ME_server_ip:3000"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  worker:
    image: ghcr.io/mrsat13/kumaflow-brain-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      ENV: prod
      LOG_LEVEL: INFO
      DB_URL_OVERRIDE: ""
      POSTGRES_HOST: postgres
      POSTGRES_USER: kumaflow
      POSTGRES_PASSWORD: CHANGE_ME_postgres_password
      POSTGRES_DB: kumaflow
      REDIS_HOST: redis
      MEDIA_SERVER_TYPE: navidrome
      NAVIDROME_URL: http://host.docker.internal:4533
      # --- Настоящий sonic-анализ читает реальные mp3 ---
      # Вариант А (быстрее): та же папка музыки, что у Navidrome, только чтение.
      # Раскомментируй и укажи путь на хосте; путь внутри worker (/music)
      # должен совпадать с путём внутри Navidrome.
      # MUSIC_DIR: /music
      # Вариант Б (ничего не монтировать): оставь как есть — worker будет
      # тянуть каждый трек стримом из Navidrome через Subsonic API.
      ANALYSIS_SAMPLE_SECONDS: 90
      ANALYSIS_MAX_TRACKS_PER_RUN: 200
    # volumes:
    #   - /путь/к/музыке/на/хосте:/music:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.workers.rq_worker"]

  web:
    image: ghcr.io/mrsat13/kumaflow-brain-web:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      KUMAFLOW_API_URL: http://backend:8000
    ports:
      - "3000:3000"

  # Опционально: мост метаданных (MusicBrainz / Last.fm). Включается профилем:
  #   docker compose --profile bridge up -d
  # Адрес моста затем указывается в веб-UI: Настройки → Мост → http://bridge:8001
  bridge:
    image: ghcr.io/mrsat13/kumaflow-brain-bridge:latest
    restart: unless-stopped
    profiles: [bridge]
    environment:
      # Ключ: https://www.last.fm/api/account/create (без него — только MusicBrainz)
      LASTFM_API_KEY: ""
      BRIDGE_USER_AGENT: KumaFlowBridge/0.1
      BRIDGE_CACHE_TTL_HOURS: 24
    ports:
      - "8001:8001"

volumes:
  pgdata:
  redisdata:
